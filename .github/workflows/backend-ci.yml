name: Backend CI

on:
  push:
    branches: [ main, develop, 'claude/**' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Run tests
      working-directory: ./backend
      run: sbt test

    - name: Build
      working-directory: ./backend
      run: sbt compile

    - name: Package
      working-directory: ./backend
      run: sbt stage
